<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar | Engineering Material</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root {
      --ink:#132238;
      --muted:#64748b;
      --paper:#f6f1e8;
      --surface:#fffdf8;
      --line:#ddd6c8;
      --mint:#c8e6f0;
      --green:#173f5f;
      --orange:#f05d5e;
      --shadow:0 18px 50px rgba(19,34,56,.14);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      color:var(--ink);
      background:var(--paper);
      font-family:'DM Sans',sans-serif;
    }
    a { color:inherit; text-decoration:none; }
    .shell {
      max-width:980px;
      margin:auto;
      padding:28px 38px 60px;
    }
    header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:58px;
      gap:20px;
    }
    .brand {
      display:flex;
      align-items:center;
      gap:11px;
      font:700 20px 'Space Grotesk',sans-serif;
    }
    .brand-mark {
      display:grid;
      place-items:center;
      width:35px;
      height:35px;
      color:#fff;
      background:var(--green);
      border-radius:11px 11px 11px 3px;
      font-weight:700;
    }
    .back {
      padding:11px 15px;
      color:var(--green);
      background:var(--mint);
      border-radius:10px;
      font-size:13px;
      font-weight:700;
    }
    .eyebrow {
      color:var(--green);
      font-size:12px;
      font-weight:700;
      letter-spacing:1.2px;
      text-transform:uppercase;
    }
    h1 {
      margin:14px 0 10px;
      font:700 clamp(38px,6vw,64px)/1 'Space Grotesk',sans-serif;
      letter-spacing:-1.5px;
    }
    .calendar-shell {
      margin-top:34px;
      display:grid;
      gap:18px;
    }
    .year-toolbar {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:4px;
    }
    .year-pill {
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--muted);
      font-weight:700;
      font-size:13px;
      box-shadow:0 8px 18px rgba(19,34,56,.05);
      cursor:pointer;
    }
    .year-pill.active {
      background:var(--mint);
      border-color:var(--mint);
      color:var(--green);
    }
    .year-grid {
      display:grid;
      grid-template-columns:repeat(2, minmax(220px, 1fr));
      gap:18px;
    }
    .month-card {
      position:relative;
      background:linear-gradient(145deg, #fffdfb, #f5efe8);
      border:1px solid var(--line);
      border-radius:20px;
      padding:18px 16px 14px;
      box-shadow:0 18px 28px rgba(19,34,56,.08), inset 0 1px 0 rgba(255,255,255,.8);
      transform:perspective(1200px) rotateX(8deg) rotateY(-7deg);
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .month-card:hover {
      transform:perspective(1200px) rotateX(0deg) rotateY(0deg) translateY(-3px);
      box-shadow:0 24px 35px rgba(19,34,56,.12);
    }
    .month-card.current {
      background:linear-gradient(145deg, #dff5ff, #f5fafc);
      border-color:#b8dff0;
      box-shadow:0 22px 36px rgba(36,99,126,.16), inset 0 1px 0 rgba(255,255,255,.9);
      transform:perspective(1200px) rotateX(0deg) rotateY(0deg) translateY(-4px);
    }
    .month-card.current::before {
      content:"Current";
      position:absolute;
      top:12px;
      right:12px;
      padding:4px 8px;
      border-radius:999px;
      background:var(--green);
      color:#fff;
      font-size:10px;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .month-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
      gap:10px;
    }
    .month-header h2 {
      margin:0;
      font:700 18px 'Space Grotesk',sans-serif;
      color:var(--ink);
    }
    .mini-month {
      display:grid;
      gap:4px;
    }
    .mini-week, .mini-days {
      display:grid;
      grid-template-columns:repeat(7, minmax(0, 1fr));
      gap:4px;
    }
    .mini-week {
      color:var(--muted);
      font-size:9px;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:2px;
    }
    .mini-week span, .mini-days span {
      display:grid;
      place-items:center;
      min-height:22px;
      border-radius:6px;
      font-weight:700;
      font-size:10px;
    }
    .mini-days span {
      background:rgba(19,34,56,.03);
      color:var(--ink);
    }
    .mini-days span.muted {
      opacity:.35;
      background:rgba(148,163,184,.08);
    }
    .mini-days span.current {
      background:var(--green);
      color:#fff;
      box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);
    }
    @media (max-width:760px) {
      .year-grid { grid-template-columns:1fr; }
    }
    @media (max-width:520px) {
      .shell { padding:20px 16px 40px; }
      header { margin-bottom:40px; }
      .brand { font-size:18px; }
      .month-card { padding:14px 12px 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="index.html"><span class="brand-mark">E</span> Engineering Material</a>
      <a class="back" href="index.html">&lt;- Dashboard</a>
    </header>

    <main>
      <span class="eyebrow">Schedule</span>
      <h1>Calendar</h1>

      <section class="calendar-shell" aria-label="Year calendar overview">
        <div class="year-toolbar" aria-label="Year selector">
          <button class="year-pill" type="button" data-year="2025">2025</button>
          <button class="year-pill active" type="button" data-year="2026">2026</button>
          <button class="year-pill" type="button" data-year="2027">2027</button>
        </div>

        <div class="year-grid" id="yearGrid"></div>
      </section>
    </main>

    <script>
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

      function buildMonthGrid(year, monthIndex) {
        const firstDay = new Date(year, monthIndex, 1);
        const lastDay = new Date(year, monthIndex + 1, 0);
        const startOffset = firstDay.getDay();
        const totalDays = lastDay.getDate();
        const cells = [];

        const prevMonthLastDay = new Date(year, monthIndex, 0).getDate();
        for (let i = 0; i < startOffset; i++) {
          cells.push({ value: prevMonthLastDay - startOffset + i + 1, muted: true });
        }

        for (let day = 1; day <= totalDays; day++) {
          cells.push({ value: day, muted: false });
        }

        while (cells.length % 7 !== 0) {
          cells.push({ value: cells.length - (startOffset + totalDays) + 1, muted: true });
        }

        return cells;
      }

      function renderYear(year) {
        const grid = document.getElementById('yearGrid');
        const today = new Date();
        const currentYear = today.getFullYear();
        const currentMonthIndex = today.getMonth();
        const currentDay = today.getDate();

        grid.innerHTML = monthNames.map((month, index) => {
          const days = buildMonthGrid(year, index);
          const isCurrentMonth = year === currentYear && index === currentMonthIndex;

          return `
            <article class="month-card ${isCurrentMonth ? 'current' : ''}">
              <div class="month-header"><h2>${month}</h2></div>
              <div class="mini-month">
                <div class="mini-week">
                  <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
                </div>
                <div class="mini-days">
                  ${days.map(day => {
                    const isCurrentDate = isCurrentMonth && !day.muted && day.value === currentDay;
                    return `<span class="${day.muted ? 'muted' : ''} ${isCurrentDate ? 'current' : ''}">${day.value}</span>`;
                  }).join('')}
                </div>
              </div>
            </article>
          `;
        }).join('');

        document.querySelectorAll('.year-pill').forEach(button => {
          button.classList.toggle('active', Number(button.dataset.year) === year);
        });
      }

      document.querySelectorAll('.year-pill').forEach(button => {
        button.addEventListener('click', () => renderYear(Number(button.dataset.year)));
      });

      renderYear(2026);
    </script>
  </div>
</body>
</html>
